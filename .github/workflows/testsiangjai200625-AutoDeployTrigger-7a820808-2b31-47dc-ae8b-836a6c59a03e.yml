name: Trigger auto deployment for testsiangjai200625

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ branch-1.1 ]
    paths:
    - '**'
    - '.github/workflows/testsiangjai200625-AutoDeployTrigger-7a820808-2b31-47dc-ae8b-836a6c59a03e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.TESTSIANGJAI200625_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TESTSIANGJAI200625_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TESTSIANGJAI200625_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.TESTSIANGJAI200625_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TESTSIANGJAI200625_REGISTRY_PASSWORD }}
          containerAppName: testsiangjai200625
          resourceGroup: SiangJai-01
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


